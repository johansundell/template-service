services:
  template-service:
    build: .
    ports:
      # The container listens on 8080 (set in the Dockerfile); pick the host
      # port with HOST_PORT, e.g. HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - USE_FILE_SYSTEM=false
      - STORAGE=sqlite
      - SQLITE_PATH=/app/data/template-service.db
      - DEBUG=true
    restart: unless-stopped
